<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>我的知识库 - {{ app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/notes/notes.css?v=2">
  <style>
    :root{--bg:#f4efe7;--panel:#fffdf8;--line:#e3d8c8;--text:#241d17;--muted:#766a5d;--accent:#8f1d1d;--accent-soft:#f4e3dc;}
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--bg);line-height:1.6;}
    .topbar{display:flex;align-items:center;gap:14px;padding:13px 24px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.96);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);}
    .topbar a.back{color:var(--accent);text-decoration:none;font-size:.92em;white-space:nowrap;}
    .topbar a.back:hover{text-decoration:underline;}
    .topbar h1{font-size:1.08em;margin:0;font-weight:600;letter-spacing:.02em;}
    .topbar .spacer{flex:1;}
    .topbar a.acct{color:var(--muted);text-decoration:none;font-size:.88em;white-space:nowrap;}
    .topbar a.acct:hover{color:var(--accent);}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="{{ url_for('layout_more') }}">← 进阶功能</a>
    <h1>我的知识库</h1>
    <span class="spacer"></span>
    <a class="acct" href="{{ url_for('account') }}">会员中心</a>
  </div>

  {# 内容由 MarxNotes.mountKnowledgeBase 自动挂载（脚本按 [data-marx-kb] 探测）。 #}
  <div data-marx-kb></div>

  <script src="/static/notes/notes.js?v=2" data-marx-notes data-uid="{{ (current_user.id if current_user else '') }}" data-csrf="{{ csrf_token }}"></script>
</body>
</html>
