<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国内资料原稿</title><link rel="stylesheet" href="{{ url_for('static',filename='research_updates.css') }}"><style>pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.8 sans-serif}</style></head><body><div class="paper"><header><h1>国内资料原稿</h1><p>导入 #{{ record.id }} · {{ record.created_at }}</p></header><main><a href="{{ url_for('research_updates.admin') }}">返回合并窗口</a><p>来源标识：{{ record.source_id }}</p><p>文件版本：{{ record.content_hash }}</p><h2>原始 Markdown</h2><pre>{{ payload.markdown }}</pre><details><summary>结构化字段与证据</summary><pre>{{ payload.metadata|tojson(indent=2) }}</pre></details><details><summary>导入核对结果</summary><pre>{{ result|tojson(indent=2) }}</pre></details></main></div></body></html>
