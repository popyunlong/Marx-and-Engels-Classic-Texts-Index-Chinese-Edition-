      与抗战。
      （二）共产党与八路军应对山西形势表明整个态度，
      此间正起草共产党山西省委员会给阎信，侯草就当与北
      局电商，准备于双十节发表。八路军在山西之各部队将
      领，应当对山西抗战问题发表公开意见，但以限于与八
      路军有关问题，如军区问题，粮食问题等，而不涉及新
      军牺盟等问题为好，朱彭似不宜立即出面，而以聂彭罗
      陈黄刘邓[1]出面[态度]为好。
      （三）共产党在山西的组织，尤其是新军牺盟及政权
      中的党的组织必须严密紧缩，停止不可靠的分子的党员
      组织关系，劝告同情者动摇者，变成党外同情者，洗刷
      坏分子投机分子。只有这样才能使山西我党有战斗力，
      来团结左派分子在我们周围反对山西逆流，转变局面和
      克服投降危险，如何执行请考虑。

      中　央
      廿一日
