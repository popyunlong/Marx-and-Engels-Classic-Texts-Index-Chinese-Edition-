          四、宣传工作上的错误——叶贺军队行军的时候，兵士之中并没有做充分的宣传及政治工作，所过地方的民众之中也没有宣传。同时，敌人的宣传都〔却〕非常之利害，军队行过抚州之南，差不多十几天不见一个人，这是因为朱培德等反宣传的恐吓当地居民的缘故，我军却没有先行派遣宣传〈员〉，说明“八一革命”南昌暴动及南征的意义。

