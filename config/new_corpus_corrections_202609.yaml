      第十二册（一九四〇）
      671
      全国弥漫的反共新高潮，不能视若无睹；对皖豫一带二十九师大军实行对大江南北新四军八路军的进逼包围，对陕甘宁边区周围的二十万大军包围和五道堡垒线封锁，对全国许多地方共产党员及进步人士和进步青年的逮捕杀害，对反共分子所加于共产党八路军新四军的各种无耻造谣，不能不加以严重的注意，不能不发出正义的抗议。盖当前流行的反共行为和积极策动的反共战争，绝非仅国共两党的磨擦，实有关整个民族命运的大事。
      日寇与亲日派企图用挑拨中国内战的方法，达到中国投降的目的，其心至险，其计至毒。盖剿共必会闹到投降，投降必使中国四分五裂，投降必使抗日军瓦解，投降必使抗战统帅身败名裂，投降必使亡党亡国，投降必使中国人民陷入牛马奴隶的境地。而能从投降中得利的，只是愿作溥仪式的儿皇帝，或贝当式的降将军的少数别具心肝之人。
      因此，全国各党各派各界各军先进人士，必须认清时局的当前危险，必须制止亲日派阴谋家和内战挑拨者的滔天罪行，号召一切军民不作我为鹬蚌相争，渔人得利的妄举，呼吁全国同胞不作枪口对内亲痛仇快的狂行，响亮的高呼出反对投降反对内战的口号，诚恳的提出全国同胞团结起来制止投降制止内战的要求，坚决的发出驱逐亲日奸徒汪逆余孽的号召，英勇的挺身出来作团结全民捍卫民族的先驱，使一触即发可能的内战停止，使摆在眼前的直接投降危险克服，则不仅尽了我们应有的天然职责，而且挽救了我们后世子孙的奴隶命运。
      因此，为制止投降与制止内战而奋斗，成为全国人民和中国共产党的当前紧急任务！
      因此，不管日本帝国主义者如何挑拨离间，不管亲日派阴谋家和内战挑拨者如何造谣诽谤，不管剿共军如何开动，不管剿共
