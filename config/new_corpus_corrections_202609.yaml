      参加，在全体团长团员中，除在二届参政会中，因发扬民主和谬论而与共产党参政员及坚持抗战诸参政员发生剧烈冲突之国社党员梁实秋及国家青年党员余家菊两君外，余皆国民党一党之参政员同志。由此等人选所组成之视察团，对于视察事项所收材料及所作结论，必属偏私害公殆无疑义。该团之与特务机关配合行动，尤属事有必至。犹忆前年十二月间，张君励即曾著论主张取消所谓边区与八路军特殊化及取消共产主义。未几，汪精卫发表艳电，竟倡言反共。设该视察团之目的与汪张无殊，尽可以汪张文件为蓝本，在渝作出大文，撰成提案，何必当此朔风凛冽之际，冒此严寒，多劳往返。如以为非有实地视察之名，不足以收牢笼社会视听之效，则以此等有特殊关系之人物从特务机关手里收集向壁虚造之材料，写成一本二三十万字之视察报告书，痛骂共产党一顿，谓即足为反共限共溶共之法律根据，则亦仍属可笑之事。盖国内政治问题，原只能从合理之政治原则获得解决，岂有卖弄玄虚，而能真正解决问题者乎。或曰，你们共产党所云，未免估计不当，该视察团此行，盖十分正大光明，毫无腌臜疑忌之心理，其任务在于维系两党合作，立于团结与进步基础上，共谋边区等事之合理解决也。若然，则鄙人等所言幸而不中，而国事实获进步之益，鄙人等当于该团来延安时，准备以陕北特产之小米饭高粱酒，接待诸参政员同人，与之对雪举杯畅论团结救国之大计，决不至慢待嘉宾也。敬祈贵处代
