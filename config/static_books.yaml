# 自托管「原文文库」书目登记。
# 内容为纯静态 HTML 文本，置于  static_library/<folder>/  下，
# 由路由  /wenku/raw/<key>/...  直发（带会员权限硬门禁，见 static_library_web.py）。
# 每页内嵌原书页码锚点（列宁 id="sNNN" / MEGA id="SNN"），阅读器据此生成「页码级引文」。
# citation.tpl_zh / tpl_alt 为引文模板，占位符 {key} 取自该卷字段(优先)与 citation 字段；{page} 为当前页。
# 引文年 year 一律取**各卷书内真实印本年**（列宁=Подписано-к-печати；MEGA=该卷实际出版年）。

