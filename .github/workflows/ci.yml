name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - production
  pull_request:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Reject generated or duplicated source trees
        run: |
          if git ls-files | grep -Eq '(^|/)(artifacts|release|releases|build|dist|\.security-work)/|static/vendor/pdfjs'; then
            echo "Generated release trees or unused pdf.js files must not be tracked."
            exit 1
          fi

      - name: Compile every tracked Python file
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Run deterministic pull-request tests
        run: python -m pytest tests/test_deploy_manifests.py tests/test_release_metadata.py tests/test_release_health_evidence.py tests/test_catalog_probe_timing.py tests/test_release_interruption.py tests/test_catalog_release.py tests/test_catalog_traffic.py tests/test_catalog_snapshot.py tests/test_catalog_health.py tests/test_release_upload.py tests/test_candidate_review.py tests/test_layout_release_smoke.py tests/test_paddle_repair.py tests/test_corpus_release.py tests/test_fuzzy_alignment.py tests/test_research_citation_recovery.py tests/test_flash_compatibility.py -q

      - name: Check durable catalogue observation and browser progress
        run: python -m pytest tests/test_catalog_server_observation.py tests/test_catalog_browser_review.py tests/test_prepare_mega_iv3_verified.py -q

      - name: Check release shell syntax
        run: |
          bash -n deploy/promote_release.sh
          bash -n deploy/rollback_release.sh
          bash -n deploy/release_traffic.sh
          bash -n deploy/review_gate.sh
          bash -n deploy/watchdog_release.sh
          bash -n deploy/install_paddle_worker.sh
          bash -n deploy/promote_new_corpus_202609.sh
          bash -n deploy/promote_corpus_repair_candidate.sh

  browser-gate:
    name: AI controls browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser fixture dependencies
        run: |
          python -m pip install Flask
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check AI controls in a real browser without live API calls
        run: node --test --test-reporter=spec tests/browser/ai_controls.cjs 2>&1 | tee /tmp/ai-controls-browser.log
      - name: Include browser failure details in check annotations
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          log = Path('/tmp/ai-controls-browser.log')
          if log.exists():
              text = log.read_text()[-24000:]
              print('::error title=AI browser regression::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY

  integration-gate:
    name: Main integration gate (Python 3.10)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))
    needs: [fast-gate, browser-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up production Python line
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full repository test suite
        run: python -m pytest tests/ -q

      - name: Run application deployment smoke
        run: python scripts/deployment_smoke.py --mode server

      - name: Prove complete release package reproducibility
        run: |
          mkdir -p /tmp/release-repro/app
          git archive --format=tar HEAD | tar -x -C /tmp/release-repro/app
          python /tmp/release-repro/app/scripts/build_release_manifest.py create \
            --source-dir /tmp/release-repro/app \
            --output /tmp/release-repro/release.json \
            --release-id 0000000000000000000000000000000000000000-rehearsal \
            --git-sha 0000000000000000000000000000000000000000 \
            --parent-release-id ci-parent \
            --built-at 2000-01-01T00:00:00Z
          python /tmp/release-repro/app/scripts/build_release_archive.py \
            --source-dir /tmp/release-repro/app --metadata /tmp/release-repro/release.json \
            --output /tmp/release-repro/package-a.tar.gz
          python /tmp/release-repro/app/scripts/build_release_archive.py \
            --source-dir /tmp/release-repro/app --metadata /tmp/release-repro/release.json \
            --output /tmp/release-repro/package-b.tar.gz
          cmp /tmp/release-repro/package-a.tar.gz /tmp/release-repro/package-b.tar.gz

  production-gate:
    name: Production lineage and rollback gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: integration-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up production Python line
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install release-gate test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify production is contained in main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify immutable release controls
        run: |
          grep -q '/run/lock/marx-search-release.lock' deploy/promote_release.sh
          grep -q 'parent_release_id' deploy/promote_release.sh
          grep -q 'rollback' deploy/rollback_release.sh
          test "$(git status --porcelain --untracked-files=all)" = ""

      - name: Rehearse metadata creation and tamper rejection
        run: python -m pytest tests/test_release_metadata.py -q
